name: Android CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'tools platform-tools build-tools;34.0.0 platforms;android-34'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Run unit tests
      run: ./gradlew test --no-daemon --stacktrace

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload debug APK
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: mohandescalc-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
        if-no-files-found: warn

    - name: Lint check
      run: ./gradlew lint --no-daemon
      continue-on-error: true

    - name: Upload lint reports
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: lint-reports
        path: app/build/reports/
        retention-days: 7
        if-no-files-found: warn

  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'tools platform-tools build-tools;34.0.0 platforms;android-34'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode release keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "⚠️  RELEASE_KEYSTORE_BASE64 secret not set — skipping release build"
          exit 0
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > mohandescalc.keystore
        echo "KEYSTORE_READY=true" >> $GITHUB_ENV

    - name: Build release APK
      if: env.KEYSTORE_READY == 'true'
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # Temporarily replace signing config with env-var-driven values
        ./gradlew assembleRelease --no-daemon --stacktrace \
          -Pandroid.injected.signing.store.file=$PWD/mohandescalc.keystore \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD

    - name: Verify APK signature
      if: env.KEYSTORE_READY == 'true'
      run: |
        SDK_DIR=$ANDROID_HOME
        if [ -z "$SDK_DIR" ]; then SDK_DIR=$ANDROID_SDK_ROOT; fi
        APKSIGNER=$(find $SDK_DIR -name apksigner -type f | head -1)
        $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk

    - name: Upload release APK
      if: env.KEYSTORE_READY == 'true'
      uses: actions/upload-artifact@v5
      with:
        name: mohandescalc-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30
        if-no-files-found: warn
